name = "your-story-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Comma-separated list of allowed origins for CORS, e.g.
# "https://your-story.app,http://localhost:3000"
# Set via `wrangler secret put ALLOWED_ORIGINS` or as a plain var below.
[vars]
ALLOWED_ORIGINS = "http://localhost:3000"

# Create with: wrangler kv namespace create SYNC_KV
# then paste the returned id here.
[[kv_namespaces]]
binding = "SYNC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
